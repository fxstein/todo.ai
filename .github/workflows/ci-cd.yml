name: CI/CD

# Single workflow for CI and Release with mandatory dependencies
# Dependency chain: quality → tests → all-tests-pass → validate-release → release
# This ensures releases CANNOT proceed unless ALL tests pass

run-name: ${{ github.ref_type == 'tag' && format('📦 Release {0}', github.ref_name) || github.event.head_commit.message }}

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  create-release-tag:
    name: Create Release Tag
    if: |
      github.ref == 'refs/heads/main' &&
      github.event.head_commit != null &&
      startsWith(github.event.head_commit.message, 'chore: Release v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract and push tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          msg="$COMMIT_MSG"
          tag=$(echo "$msg" | sed -nE 's/^chore: Release (v[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+)?).*/\1/p')
          if [ -z "$tag" ]; then
            echo "Could not parse release tag from commit message: $msg"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists locally"
          else
            git tag -a "$tag" -m "Release $tag"
          fi

          if git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists on origin"
          else
            git push origin "$tag"
          fi

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      logs: ${{ steps.filter.outputs.logs }}
      code: ${{ steps.compute.outputs.code }}
      code_files: ${{ steps.compute.outputs.code_files }}
      is_tag: ${{ steps.refs.outputs.is_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect change types
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          filters: |
            docs:
              - '*.md'
              - '**/*.md'
            logs:
              - '*.log'
              - '**/*.log'
            all:
              - '**/*'

      - name: Derive code changes
        id: compute
        run: |
          files="${{ steps.filter.outputs.all_files }}"
          code=false
          code_files=""

          for f in $files; do
            if [[ "$f" != *.md && "$f" != *.log ]]; then
              code=true
              code_files+="$f "
            fi
          done

          code_files="${code_files%% }"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code_files=$code_files" >> "$GITHUB_OUTPUT"

      - name: Detect tag ref
        id: refs
        run: |
          echo "================================================"
          echo "🏷️  TAG DETECTION"
          echo "================================================"

          ref="${GITHUB_REF:-}"
          ref_type="${GITHUB_REF_TYPE:-}"
          ref_name="${GITHUB_REF_NAME:-}"
          is_tag=false

          echo "Environment variables:"
          echo "  GITHUB_REF: '$ref'"
          echo "  GITHUB_REF_TYPE: '$ref_type'"
          echo "  GITHUB_REF_NAME: '$ref_name'"
          echo ""

          echo "Tag detection logic:"
          if [[ "$ref" == refs/tags/v* ]]; then
            echo "  ✅ Condition 1: GITHUB_REF matches 'refs/tags/v*'"
            is_tag=true
          else
            echo "  ❌ Condition 1: GITHUB_REF does not match 'refs/tags/v*'"
          fi

          if [[ "$ref_type" == "tag" ]]; then
            echo "  ✅ Condition 2: GITHUB_REF_TYPE == 'tag'"
            is_tag=true
          else
            echo "  ❌ Condition 2: GITHUB_REF_TYPE != 'tag' (value: '$ref_type')"
          fi

          echo ""
          echo "Result: is_tag=$is_tag"
          echo "  Writing to GITHUB_OUTPUT: is_tag=$is_tag"
          echo "is_tag=$is_tag" >> "$GITHUB_OUTPUT"
          echo "================================================"

  docs-quality:
    name: Docs Quality
    needs: changes
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for forbidden flags
        run: |
          # Build the forbidden flag using string concatenation to avoid self-detection
          FORBIDDEN="--no-""verify"
          echo "Checking for forbidden flag: ${FORBIDDEN}"

          if grep -r "$FORBIDDEN" release/ .github/ scripts/ 2>/dev/null; then
            echo ""
            echo "❌ CRITICAL: Found forbidden flag '$FORBIDDEN' in codebase"
            echo "This flag is ETERNALLY FORBIDDEN."
            echo "It bypasses all pre-commit hooks and safety checks."
            echo "No automated process may use it without explicit human approval."
            exit 1
          fi

          echo "✅ No forbidden flags found"

      - name: Validate documentation
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            **/*.md
            !node_modules/**
            !.git/**
            !.venv/**
            !**/site-packages/**
            !**/dist-info/**
            !**/dist/**
            !.ai-todo/**

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint ASCII art boxes
        run: uv run ascii-guard lint .
        env:
          PYTHONIOENCODING: utf-8

      - name: Lint TODO.md
        run: uv run ai-todo lint

  logs-quality:
    name: Logs Quality
    needs: changes
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      needs.changes.outputs.logs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder for log-only changes
        run: echo "Log-only change detected. No checks required."

  quality:
    name: Code Quality
    needs: changes
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') ||
      (github.event_name == 'push' && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check for forbidden flags
        run: |
          # Build the forbidden flag using string concatenation to avoid self-detection
          FORBIDDEN="--no-""verify"
          echo "Checking for forbidden flag: ${FORBIDDEN}"

          if grep -r "$FORBIDDEN" release/ .github/ scripts/ 2>/dev/null; then
            echo ""
            echo "❌ CRITICAL: Found forbidden flag '$FORBIDDEN' in codebase"
            echo "This flag is ETERNALLY FORBIDDEN."
            echo "It bypasses all pre-commit hooks and safety checks."
            echo "No automated process may use it without explicit human approval."
            exit 1
          fi

          echo "✅ No forbidden flags found"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Cache pre-commit hooks
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run pre-commit checks (code files only)
        run: |
          files="${{ needs.changes.outputs.code_files }}"
          if [ -z "$files" ]; then
            echo "No code files changed; skipping pre-commit checks."
            exit 0
          fi

          uv run pre-commit run --files $files

  test-comprehensive:
    name: Comprehensive Tests
    needs: [changes, quality]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && needs.changes.outputs.code == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Zsh (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run full test suite
        run: uv run pytest --cov=ai_todo --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  test-quick:
    name: Quick Tests
    needs: [changes, quality]
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && needs.changes.outputs.code == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Zsh (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest tests/unit --cov=ai_todo --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  test-pr:
    name: PR Tests
    needs: [changes, quality]
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Zsh (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run full test suite
        run: uv run pytest --cov=ai_todo --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  # Experimental: Test compatibility with fastmcp 3.x beta
  # This job is informational only - allowed to fail
  # Helps catch breaking changes early before fastmcp 3.0 stable release
  test-fastmcp-3x:
    name: 🔮 FastMCP 3.x Compatibility
    needs: quality
    if: |
      github.event_name == 'push' &&
      !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    continue-on-error: true  # Allowed to fail - informational only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install Zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Install dependencies with fastmcp 3.x
        run: |
          # Install base dependencies
          uv sync --all-extras

          # Upgrade to fastmcp 3.x beta (overrides the pinned version)
          uv pip install "fastmcp>=3.0.0b1"

          # Show installed versions
          echo "Installed fastmcp version:"
          uv pip show fastmcp | grep Version

      - name: Run test suite with fastmcp 3.x
        run: |
          echo "================================================"
          echo "🔮 FASTMCP 3.x COMPATIBILITY TEST"
          echo "================================================"
          echo ""
          echo "This is an experimental job to catch breaking changes"
          echo "early before fastmcp 3.0 stable is released."
          echo ""
          echo "Failures here are expected and informational only."
          echo "They do NOT block releases or other CI jobs."
          echo ""
          echo "================================================"
          echo ""

          uv run pytest --tb=short -v 2>&1 || {
            echo ""
            echo "================================================"
            echo "❌ Tests failed with fastmcp 3.x"
            echo ""
            echo "This is expected - fastmcp 3.x may have breaking changes."
            echo "Review the errors above to prepare for migration."
            echo "================================================"
            exit 1
          }

          echo ""
          echo "================================================"
          echo "✅ Tests passed with fastmcp 3.x!"
          echo "   ai-todo appears compatible with the beta."
          echo "================================================"

  # Summary job to gate release on all tests passing
  # This creates clear visual dependency in GitHub Actions UI
  all-tests-pass:
    name: ✅ All Tests Passed
    # Only run on tag pushes (when we need to release)
    if: |
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (startsWith(github.ref, 'refs/tags/v') || needs.create-release-tag.outputs.tag != '')
    # CRITICAL: Depends on ALL test jobs
    needs: [create-release-tag, docs-quality, logs-quality, quality, test-quick, test-comprehensive]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate all checks
        run: |
          echo "================================================"
          echo "✅ ALL TESTS PASSED - RELEASE GATE"
          echo "================================================"
          echo ""
          echo "Job Results:"
          echo "  docs-quality: ${{ needs.docs-quality.result }}"
          echo "  logs-quality: ${{ needs.logs-quality.result }}"
          echo "  quality: ${{ needs.quality.result }}"
          echo "  test-quick: ${{ needs.test-quick.result }}"
          echo "  test-comprehensive: ${{ needs.test-comprehensive.result }}"
          echo ""

          failures=0
          for result in \
            "${{ needs.docs-quality.result }}" \
            "${{ needs.logs-quality.result }}" \
            "${{ needs.quality.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              failures=1
            fi
          done

          # Test jobs MUST have run successfully (skipped is not acceptable)
          for result in \
            "${{ needs.test-quick.result }}" \
            "${{ needs.test-comprehensive.result }}"; do
            if [ "$result" != "success" ]; then
              echo "❌ Test job did not succeed (result: $result)"
              failures=1
            fi
          done

          if [ "$failures" -ne 0 ]; then
            echo "❌ One or more required checks failed"
            exit 1
          fi

          echo "✅ All quality checks and tests have passed"
          echo "   - Documentation validation"
          echo "   - Log file validation"
          echo "   - Code quality checks"
          echo "   - Quick tests (3.10, 3.11, 3.12, 3.13, 3.14 x 3 OSes)"
          echo "   - Comprehensive tests (3.14 x 3 OSes)"
          echo ""
          echo "Ready to proceed with release validation and publishing"

  # Validate release version using Python's packaging library
  validate-release:
    name: Validate Release Version
    # CRITICAL: Only runs AFTER all tests pass
    needs: [create-release-tag, all-tests-pass]
    # Only run on tag pushes - use direct GitHub context for reliability
    # CRITICAL: Explicitly require all-tests-pass to succeed (not just not-fail)
    if: |
      !cancelled() &&
      needs.all-tests-pass.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (startsWith(github.ref, 'refs/tags/v') || needs.create-release-tag.outputs.tag != '')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
    steps:
      - name: Resolve release tag
        id: resolve-tag
        run: |
          if [ -n "${{ needs.create-release-tag.outputs.tag }}" ]; then
            echo "tag=${{ needs.create-release-tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ needs.create-release-tag.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug workflow context
        run: |
          echo "================================================"
          echo "🔍 WORKFLOW CONTEXT DIAGNOSTICS"
          echo "================================================"
          echo ""
          echo "Trigger Information:"
          echo "  Event name: ${{ github.event_name }}"
          echo "  Ref: ${{ github.ref }}"
          echo "  Ref type: ${{ github.ref_type }}"
          echo "  Ref name: ${{ github.ref_name }}"
          echo "  SHA: ${{ github.sha }}"
          echo ""
          echo "Dependency Status:"
          echo "  all-tests-pass: ${{ needs.all-tests-pass.result }}"
          echo ""
          echo "GitHub Context (direct):"
          echo "  GITHUB_REF: '$GITHUB_REF'"
          echo "  GITHUB_REF_TYPE: '$GITHUB_REF_TYPE'"
          echo "  GITHUB_REF_NAME: '$GITHUB_REF_NAME'"
          echo "  GITHUB_EVENT_NAME: '$GITHUB_EVENT_NAME'"
          echo ""
          echo "Tag Detection:"
          echo "  startsWith(github.ref, 'refs/tags/v'): $(if [[ "${{ github.ref }}" == refs/tags/v* ]]; then echo 'true'; else echo 'false'; fi)"
          echo ""
          echo "================================================"

      - name: Validate PEP 440 version and check commit CI
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.resolve-tag.outputs.tag }}"
          VERSION="${{ steps.resolve-tag.outputs.version }}"

          echo "Tag: $TAG"
          echo "Version: $VERSION"
          echo ""

          # Install packaging library
          pip install packaging

          # Validate PEP 440 format and check if it's a pre-release
          python << EOF
          import sys
          from packaging.version import Version, InvalidVersion

          try:
              v = Version("$VERSION")

              # Block dev and post releases (not intended for public release)
              if v.is_devrelease:
                  print("❌ Dev releases (.dev) are not allowed")
                  sys.exit(1)
              if v.is_postrelease:
                  print("❌ Post releases (.post) are not allowed")
                  sys.exit(1)

              # Determine if pre-release
              is_prerelease = "true" if v.is_prerelease else "false"

              print(f"✅ Valid PEP 440 version: {v}")
              print(f"   Pre-release: {is_prerelease}")

              # Output for GitHub Actions
              with open("$GITHUB_OUTPUT", "a") as f:
                  f.write(f"version={v}\n")
                  f.write(f"is_prerelease={is_prerelease}\n")

          except InvalidVersion as e:
              print(f"❌ Invalid PEP 440 version: {e}")
              sys.exit(1)
          EOF

          echo ""
          echo "Checking if commit's CI passed..."

          # Brief wait for GitHub's commit status API to update
          # (release.sh already waited for CI, but API may have caching lag)
          echo "Waiting 10 seconds for GitHub API to update..."
          sleep 10

          # Quick check using commit status API (no polling)
          status=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/status --jq '.state' 2>/dev/null || echo "unknown")

          echo "Commit CI status: $status"

          # Only fail if status is explicitly "failure" or "error"
          # Accept "success" and "pending" since release.sh already waited for CI
          # (API caching can cause "pending" even after CI passed)
          if [ "$status" = "failure" ] || [ "$status" = "error" ]; then
            echo "❌ CI failed for this commit (status: $status)"
            echo "   This indicates actual CI failures on the commit"
            echo "   Use 'release.sh' which validates CI before pushing tags"
            exit 1
          fi

          if [ "$status" = "success" ]; then
            echo "✅ CI passed for this commit"
          elif [ "$status" = "pending" ]; then
            echo "⚠️  CI status still pending (API caching lag)"
            echo "   release.sh already validated CI passed"
            echo "   Proceeding with release..."
          else
            echo "⚠️  CI status unknown: $status"
            echo "   release.sh already validated CI passed"
            echo "   Proceeding with release..."
          fi

  release:
    name: 📦 Build and Publish Release
    # CRITICAL: Full dependency chain enforced:
    #   quality → tests → all-tests-pass → validate-release → release
    # This ensures release CANNOT proceed unless ALL tests pass
    needs: [create-release-tag, validate-release]
    # Only run on tag pushes - use same direct GitHub context as validate-release
    # CRITICAL: Explicitly require validate-release to succeed
    if: |
      !cancelled() &&
      needs.validate-release.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (startsWith(github.ref, 'refs/tags/v') || needs.create-release-tag.outputs.tag != '')
    runs-on: ubuntu-latest
    environment: release # Required for PyPI Trusted Publisher
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Debug release context
        run: |
          echo "================================================"
          echo "📦 RELEASE JOB CONTEXT DIAGNOSTICS"
          echo "================================================"
          echo ""
          echo "Trigger Information:"
          echo "  Event: ${{ github.event_name }}"
          echo "  Ref: ${{ github.ref }}"
          echo "  Ref name: ${{ github.ref_name }}"
          echo "  SHA: ${{ github.sha }}"
          echo ""
          echo "Dependency Status:"
          echo "  validate-release: ${{ needs.validate-release.result }}"
          echo ""
          echo "Validate-Release Job Outputs:"
          echo "  version: '${{ needs.validate-release.outputs.version }}'"
          echo "  is_prerelease: '${{ needs.validate-release.outputs.is_prerelease }}'"
          echo ""
          echo "Job Conditional:"
          echo "  if: startsWith(github.ref, 'refs/tags/v')"
          echo "  Result: $(if [[ "${{ github.ref }}" == refs/tags/v* ]]; then echo 'TRUE (job running)'; else echo 'FALSE (should not run)'; fi)"
          echo ""
          echo "================================================"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-release-tag.outputs.tag || github.ref_name }}

      # Pre-release flag comes from validation job (uses Python packaging library)
      # No need to detect again - just use the validated value

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Build package
        run: uv run python -m build

      - name: Check package
        run: uv run twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          verbose: true

      - name: Create GitHub Release with all assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release-tag.outputs.tag || github.ref_name }}
          files: |
            dist/*
            legacy/todo.ai
            legacy/todo.bash
          # Read release notes from file (generated by release.sh with AI summary + commits)
          body_path: release/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ needs.validate-release.outputs.is_prerelease }}
        env:
